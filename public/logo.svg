      <line x1="-1" y1="6" x2="1" y2="6" stroke="#0f172a" stroke-width="1.4" />
      <line x1="-3" y1="12" x2="3" y2="12" stroke="#0f172a" stroke-width="1.4" />
      <line x1="-1" y1="18" x2="1" y2="18" stroke="#0f172a" stroke-width="1.4" />

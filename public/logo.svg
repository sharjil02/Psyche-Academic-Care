    <ellipse cx="0" cy="0" rx="18" ry="7" stroke="#0f172a" stroke-width="1.8" fill="none" transform="rotate(0)" />
    <ellipse cx="0" cy="0" rx="18" ry="7" stroke="#0f172a" stroke-width="1.8" fill="none" transform="rotate(60)" />
    <ellipse cx="0" cy="0" rx="18" ry="7" stroke="#0f172a" stroke-width="1.8" fill="none" transform="rotate(-60)" />

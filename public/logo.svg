    <path d="M 0,-2 C 38,-14 85,-11 122,15 C 80,2 38,3 0,14 Z" fill="#0f172a" />
    <path d="M 0,6 C 35,-4 78,-2 112,24 C 72,11 35,11 0,18 Z" fill="#0f172a" />
